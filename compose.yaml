services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: opt-api:local
    init: true
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      UV_THREADPOOL_SIZE: "2"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
